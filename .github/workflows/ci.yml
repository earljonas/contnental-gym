name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke-test production routes
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          base_url=http://127.0.0.1:3000
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --max-time 5 --output /dev/null "$base_url/"
          curl --fail --silent --show-error --max-time 5 --output /dev/null "$base_url/register"
          curl --fail --silent --show-error --max-time 5 --output /dev/null "$base_url/login"

          redirect=$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$base_url/dashboard")
          if [[ "$redirect" != "307 $base_url/login" ]]; then
            echo "Expected an anonymous dashboard redirect to login, got: $redirect" >&2
            exit 1
          fi
