name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    name: Verify database migrations and pilot rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ci-local-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply migrations and run SQL assertions
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pilot_operations.sql

  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke-test production routes
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          base_url=http://127.0.0.1:3000
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --max-time 5 --output /dev/null "$base_url/"
          curl --fail --silent --show-error --max-time 5 --output /dev/null "$base_url/register"
          curl --fail --silent --show-error --max-time 5 --output /dev/null "$base_url/login"

          redirect=$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$base_url/dashboard")
          if [[ "$redirect" != "307 $base_url/login" ]]; then
            echo "Expected an anonymous dashboard redirect to login, got: $redirect" >&2
            exit 1
          fi
          coach_status=$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' -X POST "$base_url/api/coach")
          test "$coach_status" = 404
